<title id="title">Luca Garulli &#8212; ArcadeDB / Arcade Platform</title><desc id="desc">Luca Garulli, creator of ArcadeDB. A diagram of an application talking to Arcade Platform (process engine, AI orchestration, auth and tenancy), which routes into ArcadeDB's multi-model engine: Graph, Document, Vector, Time Series and Key-Value.</desc>
